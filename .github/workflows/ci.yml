name: CI

# Runs on every push to main and on every pull request. Docs-only changes
# run it too, on purpose: Prettier checks the Markdown files, so they can
# change the result, and the whole run takes a few minutes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch stops the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Keep the built site, so the deploy job publishes exactly what was
      # checked above. Only for main, never for a pull request.
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  e2e:
    name: Browser tests on the built site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Chromium, Firefox and WebKit, and the system libraries they need.
      - run: npx playwright install --with-deps

      # Builds the site, serves it as GitHub Pages will, and reads with it.
      - run: npm run e2e

      # When a test fails, keep the report, with a recording of what the
      # browser did. Download it from the run's page on GitHub.
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    name: Publish to GitHub Pages
    needs: [check, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
